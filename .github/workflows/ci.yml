name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build application and installer
        run: ./scripts/build.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MDore-macOS
          path: |
            dist/MDore-macOS.zip
            dist/MDore-macOS.dmg

