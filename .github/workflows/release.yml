name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Build application and installer
        run: ./scripts/build.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/MDore-macOS.zip dist/MDore-macOS.dmg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/MDore-macOS.zip dist/MDore-macOS.dmg --generate-notes --title "MDore ${GITHUB_REF_NAME#v}"
          fi
